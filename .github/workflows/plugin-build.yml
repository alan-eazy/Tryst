name: Plugin build

on:
  pull_request:
  workflow_dispatch:

jobs:
  linux-clap-vst3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B build
          -DTRYST_BUILD_PLUGINS=ON
          -DTRYST_BUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
